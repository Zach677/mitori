[task_config]
dir = "{{config_root}}"

[tasks.default]
description = "Build the macOS app bundle"
run = [{ task = "build-macos" }]

[tasks.help]
description = "Show project task help"
run = "mise tasks"

[tasks.build]
description = "Alias for build-macos"
run = [{ task = "build-macos" }]

[tasks.build-macos]
description = "Build the app with xcodebuild and stage the local .app bundle"
run = "bash scripts/build-macos.sh"

[tasks.run]
description = "Alias for run-macos"
run = [{ task = "run-macos" }]

[tasks.run-macos]
description = "Build and relaunch the local macOS app bundle"
run = "bash scripts/run-macos.sh"

[tasks.test]
description = "Alias for test-macos"
run = [{ task = "test-macos" }]

[tasks.test-macos]
description = "Run tests with xcodebuild"
run = "bash scripts/test-macos.sh"

[tasks.test-community]
description = "Run tests with the ad hoc community build settings"
run = "COMMUNITY_BUILD=1 bash scripts/test-macos.sh"

[tasks.package-community]
description = "Build and package the ad hoc community DMG"
run = "bash scripts/package-community.sh"

[tasks.scan-license]
description = "Regenerate bundled open-source license notices"
run = "zsh scripts/scan.license.sh"

[tasks.clean]
description = "Remove local build output and stale SwiftPM/Tuist artifacts"
run = "rm -rf .build .app-build .xcodebuild Derived .swiftpm .cache/tuist .cache/tuist-state"
