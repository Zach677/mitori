[tools]
tuist = "4.162.1"

[tasks.run-macos]
description = "Generate, build, and relaunch the macOS debug app"
run = '''
#!/usr/bin/env bash
set -euo pipefail

workspace="Mitori.xcworkspace"
project="Mitori.xcodeproj"
scheme="Mitori"
derived_data_path=".xcodebuild/run-macos"
stamp_path="$derived_data_path/.generated-stamp"

list_regeneration_inputs() {
  local path

  for path in Project.swift Tuist.swift Package.swift Package.resolved; do
    if [ -e "$path" ]; then
      printf '%s\n' "$path"
    fi
  done

  if [ -d Tuist ]; then
    find Tuist -type f \( -name '*.swift' -o -name 'Package.swift' -o -name 'Package.resolved' \)
  fi
}

needs_regeneration() {
  if [ ! -d "$workspace" ] || [ ! -d "$project" ] || [ ! -f "$stamp_path" ]; then
    return 0
  fi

  while IFS= read -r path; do
    if [ "$path" -nt "$stamp_path" ]; then
      return 0
    fi
  done < <(list_regeneration_inputs | sort -u)

  return 1
}

wait_for_app_quit() {
  local bundle_id="$1"

  for _ in {1..50}; do
    if ! osascript -e "application id \"$bundle_id\" is running" >/dev/null 2>&1; then
      return 0
    fi
    sleep 0.1
  done

  return 1
}

if needs_regeneration; then
  echo "Generating workspace..."
  tuist generate --no-open
  mkdir -p "$derived_data_path"
  touch "$stamp_path"
else
  echo "Skipping generate; manifests and dependencies are unchanged."
fi

tuist xcodebuild build \
  -workspace "$workspace" \
  -scheme "$scheme" \
  -configuration Debug \
  -destination 'platform=macOS' \
  -derivedDataPath "$derived_data_path" \
  CODE_SIGNING_ALLOWED=NO

app_path="$derived_data_path/Build/Products/Debug/Mitori.app"
plist_path="$app_path/Contents/Info.plist"

if [ ! -f "$plist_path" ]; then
  echo "Expected Info.plist at $plist_path" >&2
  exit 1
fi

bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist_path")

if osascript -e "application id \"$bundle_id\" is running" >/dev/null 2>&1; then
  osascript -e "tell application id \"$bundle_id\" to quit" >/dev/null 2>&1 || true
  wait_for_app_quit "$bundle_id" || true
fi

if osascript -e "application id \"$bundle_id\" is running" >/dev/null 2>&1; then
  pkill -TERM -f "$app_path/Contents/MacOS/" >/dev/null 2>&1 || true
  wait_for_app_quit "$bundle_id" || true
fi

open "$app_path"
'''
