[task_config]
dir = "{{config_root}}"

[tasks.default]
description = "Build the macOS app bundle"
run = [{ task = "build-macos" }]

[tasks.help]
description = "Show project task help"
run = "mise tasks"

[tasks.build]
description = "Alias for build-macos"
run = [{ task = "build-macos" }]

[tasks.build-macos]
description = "Build the app with xcodebuild and stage the local .app bundle"
run = "bash scripts/build-macos.sh"

[tasks.run]
description = "Alias for run-macos"
run = [{ task = "run-macos" }]

[tasks.run-macos]
description = "Build and relaunch the local macOS app bundle"
run = "bash scripts/run-macos.sh"

[tasks.test]
description = "Alias for test-macos"
run = [{ task = "test-macos" }]

[tasks.test-macos]
description = "Run tests with xcodebuild"
run = "bash scripts/test-macos.sh"

[tasks.test-ui-macos]
description = "Run the XCUITest suite against the offline UI fixture"
run = "TEST_TARGET=MitoriUITests bash scripts/test-macos.sh || status=$?; bash scripts/export-ui-screens.sh; exit ${status:-0}"

[tasks.test-ui-vm]
description = "Run the XCUITest suite in a local tart VM, away from the host screen"
run = "bash scripts/test-ui-vm.sh"

[tasks.release]
description = "Make a notarized Developer ID DMG in dist/; PUBLISH=1 also creates the GitHub release"
run = "bash scripts/release-macos.sh"

[tasks.scan-license]
description = "Regenerate bundled open-source license notices"
run = "zsh scripts/scan.license.sh"

[tasks.clean]
description = "Remove local build output and stale SwiftPM artifacts"
run = "rm -rf .build .app-build .xcodebuild .swiftpm"
