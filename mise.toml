[tools]
tuist = "4.162.1"

[tasks.run-macos]
description = "Install deps if needed, warm external Tuist cache, build, and relaunch the macOS debug app"
run = "bash scripts/run-macos.sh"

[tasks.test-macos]
description = "Install deps if needed, reuse the generated workspace, and run the macOS test scheme"
run = "bash scripts/test-macos.sh"

[tasks.warm-external-cache]
description = "Warm Tuist binary cache for external dependencies when the package graph changes"
run = "bash scripts/warm-external-cache.sh"
