name: Bug report
description: Something in Mitori does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Remove passwords, verification codes, cookies, Apple ID email addresses, and device identifiers from text, logs, and screenshots before you post.

        Report a security problem privately in the Security tab, not here.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: The steps to reproduce the problem, what you expected, and what you saw.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mitori version
      placeholder: "0.2.3"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.1"
    validations:
      required: true
